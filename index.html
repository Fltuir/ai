<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flowch</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #090b0a;
            --sidebar: #0d100e;
            --surface: #111512;
            --surface-hover: #171c18;
            --border: #202620;
            --text: #eeeeee;
            --muted: #8b938d;
            --green: #62d69a;
            --green-dark: #1f6b47;
            --user: #1a201c;
        }

        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        /* =========================
           APP
        ========================= */

        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 280px;
            height: 100vh;
            background: var(--sidebar);
            border-left: 1px solid var(--border);

            display: flex;
            flex-direction: column;

            transition: width 0.25s ease;
            flex-shrink: 0;
        }

        .sidebar-top {
            padding: 18px 14px 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px 20px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;

            background: #16231b;
            border: 1px solid #263c2e;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--green);
            font-weight: 700;
            font-size: 18px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .new-chat {
            width: 100%;
            height: 44px;

            background: #151a17;
            border: 1px solid var(--border);
            border-radius: 10px;

            color: #e8ebe9;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            font-size: 14px;

            transition: 0.2s;
        }

        .new-chat:hover {
            background: var(--surface-hover);
            border-color: #303a32;
        }

        .plus {
            color: var(--green);
            font-size: 20px;
            line-height: 0;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-box {
            margin-top: 12px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            height: 38px;

            background: transparent;
            border: 1px solid transparent;
            border-radius: 9px;

            outline: none;
            color: var(--text);

            padding: 0 36px 0 12px;
            font-size: 13px;

            transition: 0.2s;
        }

        .search-box input:focus {
            background: var(--surface);
            border-color: var(--border);
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            color: #6f7771;
            font-size: 14px;
            pointer-events: none;
        }

        /* =========================
           CHAT LIST
        ========================= */

        .history {
            flex: 1;
            overflow-y: auto;
            padding: 10px 10px 15px;
        }

        .history::-webkit-scrollbar {
            width: 5px;
        }

        .history::-webkit-scrollbar-thumb {
            background: #252c27;
            border-radius: 20px;
        }

        .history-title {
            color: #69716b;
            font-size: 11px;
            padding: 10px 10px 7px;
        }

        .chat-item {
            width: 100%;
            min-height: 42px;

            background: transparent;
            color: #b8beb9;

            border-radius: 9px;

            padding: 0 11px;

            display: flex;
            align-items: center;

            text-align: right;

            font-size: 13px;

            transition: 0.18s;
        }

        .chat-item:hover {
            background: var(--surface-hover);
            color: #e4e7e5;
        }

        .chat-item.active {
            background: #171d19;
            color: #f0f2f1;
        }

        .chat-item span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================
           SIDEBAR BOTTOM
        ========================= */

        .sidebar-bottom {
            border-top: 1px solid var(--border);
            padding: 12px;
        }

        .sidebar-button {
            width: 100%;
            height: 42px;

            background: transparent;
            color: #9da49f;

            border-radius: 9px;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 0 11px;

            font-size: 13px;

            transition: 0.2s;
        }

        .sidebar-button:hover {
            background: var(--surface-hover);
            color: white;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 10px 11px 2px;

            font-size: 11px;
            color: #68716b;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px rgba(98, 214, 154, 0.4);
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;
            min-width: 0;

            height: 100vh;

            display: flex;
            flex-direction: column;

            background: var(--bg);
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            height: 60px;

            border-bottom: 1px solid rgba(255,255,255,0.035);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;
        }

        .mobile-menu {
            display: none;

            background: transparent;
            color: #aaa;

            font-size: 20px;
        }

        .model-name {
            color: #aeb5b0;
            font-size: 13px;
        }

        .model-name strong {
            color: #e8ebe9;
            font-weight: 600;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-button {
            width: 36px;
            height: 36px;

            border-radius: 9px;

            background: transparent;
            color: #858d87;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 15px;

            transition: 0.2s;
        }

        .icon-button:hover {
            background: var(--surface);
            color: white;
        }

        /* =========================
           CHAT AREA
        ========================= */

        .chat-area {
            flex: 1;
            overflow-y: auto;

            scroll-behavior: smooth;
        }

        .chat-content {
            width: min(850px, calc(100% - 40px));
            margin: 0 auto;

            padding: 55px 0 160px;
        }

        /* =========================
           WELCOME
        ========================= */

        .welcome {
            min-height: calc(100vh - 250px);

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .flowch-logo {
            width: 58px;
            height: 58px;

            border-radius: 17px;

            background: #121b16;
            border: 1px solid #27372d;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--green);

            font-size: 27px;
            font-weight: 700;

            margin-bottom: 20px;

            box-shadow: 0 8px 35px rgba(0,0,0,0.25);
        }

        .welcome h1 {
            font-size: 27px;
            font-weight: 600;

            margin-bottom: 9px;

            letter-spacing: -0.5px;
        }

        .welcome p {
            color: var(--muted);
            font-size: 14px;

            margin-bottom: 30px;
        }

        .suggestions {
            width: 100%;
            max-width: 650px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 10px;
        }

        .suggestion {
            background: #0e120f;
            border: 1px solid var(--border);

            border-radius: 12px;

            padding: 15px;

            color: #c2c8c4;

            text-align: right;

            transition: 0.2s;
        }

        .suggestion:hover {
            background: #151a17;
            border-color: #2b382f;
            transform: translateY(-1px);
        }

        .suggestion-title {
            font-size: 13px;
            margin-bottom: 5px;
            color: #e1e5e2;
        }

        .suggestion-text {
            color: #747c76;
            font-size: 11px;
        }

        /* =========================
           MESSAGES
        ========================= */

        .messages {
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        .message {
            display: flex;
            gap: 13px;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-start;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .avatar {
            width: 32px;
            height: 32px;

            flex: 0 0 32px;

            border-radius: 9px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 12px;
            font-weight: 700;
        }

        .ai .avatar {
            background: #142019;
            border: 1px solid #263a2d;
            color: var(--green);
        }

        .user .avatar {
            background: #1d221f;
            color: #b8beb9;
        }

        .message-body {
            max-width: calc(100% - 50px);
            line-height: 1.8;
            font-size: 14px;
        }

        .user .message-body {
            background: var(--user);
            border: 1px solid var(--border);

            border-radius: 13px;

            padding: 10px 14px;
        }

        .ai .message-body {
            color: #d4d9d5;
        }

        .message-actions {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }

        .message-action {
            background: transparent;
            color: #626a64;

            font-size: 11px;

            padding: 4px 7px;
            border-radius: 6px;
        }

        .message-action:hover {
            background: var(--surface);
            color: #9da59f;
        }

        /* =========================
           INPUT
        ========================= */

        .input-area {
            position: fixed;

            bottom: 0;
            left: 280px;
            right: 0;

            padding: 18px 20px 22px;

            background:
                linear-gradient(
                    to top,
                    var(--bg) 70%,
                    transparent
                );
        }

        .input-wrapper {
            width: min(850px, calc(100% - 20px));
            margin: 0 auto;

            position: relative;
        }

        .chat-input {
            width: 100%;
            min-height: 58px;
            max-height: 180px;

            resize: none;

            background: #111512;

            border: 1px solid #252d27;
            border-radius: 17px;

            outline: none;

            color: #e8ebe9;

            font-size: 14px;

            padding: 17px 58px 17px 18px;

            line-height: 1.6;

            box-shadow:
                0 8px 35px rgba(0,0,0,0.18);

            transition: 0.2s;
        }

        .chat-input:focus {
            border-color: #35453a;
            background: #131814;
        }

        .chat-input::placeholder {
            color: #69716b;
        }

        .send-button {
            position: absolute;

            left: 10px;
            bottom: 10px;

            width: 38px;
            height: 38px;

            border-radius: 11px;

            background: #1d3829;
            color: var(--green);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 15px;

            transition: 0.2s;
        }

        .send-button:hover {
            background: #254834;
            transform: translateY(-1px);
        }

        .send-button:disabled {
            opacity: 0.35;
            cursor: default;
            transform: none;
        }

        .input-note {
            text-align: center;

            color: #555d57;

            font-size: 10px;

            margin-top: 8px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .sidebar {
                position: fixed;
                z-index: 100;

                right: 0;
                top: 0;
                bottom: 0;

                transform: translateX(100%);

                transition: transform 0.25s ease;

                box-shadow: -20px 0 50px rgba(0,0,0,0.35);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-menu {
                display: block;
            }

            .topbar {
                padding: 0 14px;
            }

            .input-area {
                left: 0;
            }

            .chat-content {
                width: calc(100% - 24px);
                padding-top: 30px;
            }

            .welcome h1 {
                font-size: 23px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }
        }

        /* =========================
           SMALL SCREENS
        ========================= */

        @media (max-width: 480px) {

            .model-name {
                font-size: 12px;
            }

            .welcome {
                min-height: calc(100vh - 230px);
            }

            .welcome p {
                font-size: 13px;
            }

            .input-area {
                padding: 12px 10px 15px;
            }

            .input-wrapper {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <div class="brand">
                <div class="brand-icon">F</div>
                <div class="brand-name">Flowch</div>
            </div>

            <button class="new-chat" id="newChatBtn">
                <span class="plus">+</span>
                <span>چت جدید</span>
            </button>

            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="جستجوی چت‌ها..."
                >
            </div>

        </div>

        <div class="history">

            <div class="history-title">
                امروز
            </div>

            <button class="chat-item active">
                <span>شروع کار با Flowch</span>
            </button>

            <button class="chat-item">
                <span>رفع خطای Python</span>
            </button>

            <button class="chat-item">
                <span>ساخت API برای پروژه</span>
            </button>

            <div class="history-title">
                دیروز
            </div>

            <button class="chat-item">
                <span>بررسی پروژه React</span>
            </button>

            <button class="chat-item">
                <span>ساخت سیستم لاگین</span>
            </button>

            <button class="chat-item">
                <span>رفع خطای npm</span>
            </button>

            <div class="history-title">
                این هفته
            </div>

            <button class="chat-item">
                <span>طراحی ساختار Flowch</span>
            </button>

            <button class="chat-item">
                <span>ساخت ابزار Terminal</span>
            </button>

        </div>

        <div class="sidebar-bottom">

            <button class="sidebar-button">
                <span>⚙</span>
                <span>تنظیمات</span>
            </button>

            <div class="status">
                <span class="status-dot"></span>
                <span>Flowch آماده است</span>
            </div>

        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

        <header class="topbar">

            <div style="display:flex; align-items:center; gap:12px;">

                <button
                    class="mobile-menu"
                    id="mobileMenu"
                >
                    ☰
                </button>

                <div class="model-name">
                    <strong>Flowch</strong>
                    <span> · AI Coding Assistant</span>
                </div>

            </div>

            <div class="top-actions">

                <button class="icon-button" title="تم">
                    ◐
                </button>

                <button class="icon-button" title="تنظیمات">
                    ⚙
                </button>

            </div>

        </header>


        <!-- =========================
             CHAT
        ========================== -->

        <section class="chat-area" id="chatArea">

            <div class="chat-content">

                <!-- Welcome -->

                <div class="welcome" id="welcome">

                    <div class="flowch-logo">
                        F
                    </div>

                    <h1>
                        سلام، من Flowch هستم
                    </h1>

                    <p>
                        دستیار هوش مصنوعی برای ساخت و توسعه پروژه‌های شما
                    </p>

                    <div class="suggestions">

                        <button class="suggestion">
                            <div class="suggestion-title">
                                ساخت یک پروژه جدید
                            </div>

                            <div class="suggestion-text">
                                از صفر یک پروژه Python یا JavaScript بساز
                            </div>
                        </button>

                        <button class="suggestion">
                            <div class="suggestion-title">
                                کدم را بررسی کن
                            </div>

                            <div class="suggestion-text">
                                باگ‌ها و مشکلات کدم را پیدا کن
                            </div>
                        </button>

                        <button class="suggestion">
                            <div class="suggestion-title">
                                این خطا را حل کن
                            </div>

                            <div class="suggestion-text">
                                خطای پروژه را بررسی و راه‌حل پیشنهاد بده
                            </div>
                        </button>

                        <button class="suggestion">
                            <div class="suggestion-title">
                                پروژه‌ام را تحلیل کن
                            </div>

                            <div class="suggestion-text">
                                ساختار فایل‌ها و معماری پروژه را بررسی کن
                            </div>
                        </button>

                    </div>

                </div>


                <!-- Messages -->

                <div
                    class="messages"
                    id="messages"
                    style="display:none;"
                >

                </div>

            </div>

        </section>


        <!-- =========================
             INPUT
        ========================== -->

        <div class="input-area">

            <div class="input-wrapper">

                <textarea
                    id="chatInput"
                    class="chat-input"
                    rows="1"
                    placeholder="پیام خود را برای Flowch بنویسید..."
                ></textarea>

                <button
                    id="sendButton"
                    class="send-button"
                    disabled
                >
                    ↑
                </button>

            </div>

            <div class="input-note">
                Flowch ممکن است در پاسخ‌های خود اشتباه کند؛ پاسخ‌ها را بررسی کنید.
            </div>

        </div>

    </main>

</div>


<script>

    const input = document.getElementById("chatInput");
    const sendButton = document.getElementById("sendButton");
    const welcome = document.getElementById("welcome");
    const messages = document.getElementById("messages");
    const chatArea = document.getElementById("chatArea");

    const newChatBtn = document.getElementById("newChatBtn");
    const searchInput = document.getElementById("searchInput");

    const sidebar = document.getElementById("sidebar");
    const mobileMenu = document.getElementById("mobileMenu");


    /* =========================
       INPUT
    ========================== */

    input.addEventListener("input", () => {

        sendButton.disabled =
            input.value.trim().length === 0;

        input.style.height = "auto";

        input.style.height =
            Math.min(input.scrollHeight, 180) + "px";

    });


    /* =========================
       ENTER TO SEND
    ========================== */

    input.addEventListener("keydown", (event) => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            if (!sendButton.disabled) {
                sendMessage();
            }

        }

    });


    /* =========================
       SEND MESSAGE
    ========================== */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    function sendMessage() {

        const text = input.value.trim();

        if (!text) return;

        welcome.style.display = "none";
        messages.style.display = "flex";

        addUserMessage(text);

        input.value = "";
        input.style.height = "auto";

        sendButton.disabled = true;

        /*
         * فعلاً پاسخ آزمایشی.
         * بعداً این قسمت را به Python / brain.py وصل می‌کنیم.
         */

        setTimeout(() => {

            addAIMessage(
                "پیامت دریافت شد. هسته هوش مصنوعی Flowch در مرحله بعد به این رابط متصل می‌شود."
            );

        }, 700);

    }


    /* =========================
       USER MESSAGE
    ========================= */

    function addUserMessage(text) {

        const message =
            document.createElement("div");

        message.className =
            "message user";

        message.innerHTML = `
            <div class="avatar">
                شما
            </div>

            <div class="message-body">
                ${escapeHTML(text)}
            </div>
        `;

        messages.appendChild(message);

        scrollToBottom();
    }


    /* =========================
       AI MESSAGE
    ========================= */

    function addAIMessage(text) {

        const message =
            document.createElement("div");

        message.className =
            "message ai";

        message.innerHTML = `
            <div class="avatar">
                F
            </div>

            <div class="message-body">

                ${escapeHTML(text)}

                <div class="message-actions">

                    <button
                        class="message-action"
                        onclick="copyMessage(this)"
                    >
                        کپی
                    </button>

                </div>

            </div>
        `;

        messages.appendChild(message);

        scrollToBottom();
    }


    /* =========================
       COPY
    ========================= */

    function copyMessage(button) {

        const body =
            button.closest(".message-body");

        const text =
            body.childNodes[0].textContent.trim();

        navigator.clipboard.writeText(text);

        button.textContent = "کپی شد";

        setTimeout(() => {
            button.textContent = "کپی";
        }, 1200);

    }


    /* =========================
       NEW CHAT
    ========================= */

    newChatBtn.addEventListener(
        "click",
        () => {

            welcome.style.display = "flex";
            messages.style.display = "none";

            messages.innerHTML = "";

            input.value = "";

            input.style.height = "auto";

            sendButton.disabled = true;

            input.focus();

            document
                .querySelectorAll(".chat-item")
                .forEach(item =>
                    item.classList.remove("active")
                );

        }
    );


    /* =========================
       SUGGESTIONS
    ========================= */

    document
        .querySelectorAll(".suggestion")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const title =
                        button.querySelector(
                            ".suggestion-title"
                        ).textContent;

                    input.value = title;

                    input.dispatchEvent(
                        new Event("input")
                    );

                    input.focus();

                }
            );

        });


    /* =========================
       CHAT HISTORY
    ========================= */

    document
        .querySelectorAll(".chat-item")
        .forEach(item => {

            item.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(".chat-item")
                        .forEach(chat =>
                            chat.classList.remove("active")
                        );

                    item.classList.add("active");

                    sidebar.classList.remove("open");

                }
            );

        });


    /* =========================
       SEARCH HISTORY
    ========================= */

    searchInput.addEventListener(
        "input",
        () => {

            const query =
                searchInput.value
                    .trim()
                    .toLowerCase();

            document
                .querySelectorAll(".chat-item")
                .forEach(item => {

                    const text =
                        item.textContent
                            .toLowerCase();

                    item.style.display =
                        text.includes(query)
                            ? "flex"
                            : "none";

                });

        }
    );


    /* =========================
       MOBILE SIDEBAR
    ========================= */

    mobileMenu.addEventListener(
        "click",
        () => {

            sidebar.classList.toggle("open");

        }
    );


    /* =========================
       SCROLL
    ========================= */

    function scrollToBottom() {

        setTimeout(() => {

            chatArea.scrollTo({
                top: chatArea.scrollHeight,
                behavior: "smooth"
            });

        }, 50);

    }


    /* =========================
       SECURITY
    ========================= */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }

</script>

</body>
</html>
